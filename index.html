<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PA FE DJÒL MWEN LONG</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0b0b;--card:#161616;--ink:#f3e7c4;--mut:#a89a76;--line:#3a3220;--blue:#c9982a;--red:#e6c15a;--ok:#1e3318;--okt:#9be07f;--no:#241f14;--late:#4a2f0a;--latet:#ffb454;--od:#4a2a22;--odt:#f4a58e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1,h2{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0}
h1{font-size:28px}h2{font-size:20px;margin-bottom:10px}
header{display:flex;align-items:center;gap:14px;border-bottom:6px solid var(--blue);box-shadow:0 6px 0 var(--red);padding-bottom:10px;margin-bottom:22px}
header .logo{height:84px;width:auto;flex:none}header p{margin:2px 0 0;color:var(--mut)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
button,input,select,textarea{font:inherit;color:var(--ink)}
.tab,.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.tab.on,.btn.pri{background:var(--blue);border-color:var(--blue);color:#111}
.btn.red{background:var(--red);border-color:var(--red);color:#111}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:1px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--mut)}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px}
input[type=number]{width:110px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.stat{flex:1 1 140px;border-left:5px solid var(--blue);padding:4px 12px}
.stat b{display:block;font:700 26px 'Bricolage Grotesque',sans-serif}.stat span{color:var(--mut);font-size:14px}
.stat.r{border-color:var(--red)}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.scroll{overflow-x:auto;max-width:100%}
td.paid{background:var(--ok);color:var(--okt);font-weight:600}td.unp{background:var(--no)}
.grid td,.grid th{text-align:center;min-width:64px;padding:4px}
.grid td:first-child,.grid th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:130px}
.grid input{width:60px;padding:4px;text-align:center}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue)}
.mut{color:var(--mut)}.hide{display:none}
td.late{background:var(--late);color:var(--latet);font-weight:600}td.od{background:var(--od);color:var(--odt);font-weight:600}.badge{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--late);color:var(--latet);margin-top:2px}.badge.od{background:var(--od);color:var(--odt)}.stat.late{border-color:#e08a00}
a.sms{color:var(--ink);font-weight:600;text-decoration:underline}
</style></head><body><div class="wrap">

<script>
const KEY='sousou-v1';
let S={start:'2026-11-01',weeks:49,amount:100,msg:'Hi {name}, friendly reminder: your sousou payment for week {week} ({date}) is due. Thank you!',fee:50,lateAt:'00:00',cc:'1',late:{},members:[],pay:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.members.forEach(m=>{if(m.first===undefined){const p=(m.name||'').trim().split(/\s+/);m.first=p.shift()||'';m.last=p.join(' ');delete m.name}});
S.members.forEach(m=>{if(m.hands===undefined)m.hands=1;if(m.pw===undefined)m.pw=null});
const nm=m=>(m.first+' '+m.last).trim();
const cutoff=w=>{const d=wdate(w),t=(S.lateAt||'00:00').split(':');d.setDate(d.getDate()+1);d.setHours(+t[0],+t[1]||0,0,0);return d};
function exEx(){const m=S.members[0]||{first:'Marie',last:'Joseph',hands:1},d=wdate(0),c=cutoff(0),f=x=>x.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}),tm=c.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
 return `<b>Example:</b> ${esc(nm(m))} owes ${money(due(m))} for ${f(d)}. If it is not paid by ${tm} on ${f(c)}, the ${money(S.fee)} late fee is added automatically, so ${money(due(m)+S.fee)} is owed and the box turns red-brown. When you then tick Paid, ${money(due(m)+S.fee)} is recorded and the box turns orange.`}
const due=m=>S.amount*(+m.hands||1);
const pot=()=>S.members.reduce((t,m)=>t+due(m),0);
const recv=w=>S.members.filter(m=>m.pw===w).map(m=>m.first).join(', ')||'Not set';
function sample(){S.start='2026-11-01';S.weeks=49;S.amount=100;
 const N=['Marie Joseph','Jean Baptiste','Rose Pierre','Wilson Charles','Nadine Louis','Frantz Jean-Louis','Carline Dumas','Gerald Etienne','Marlene Toussaint','Patrick Desir','Yolande Noel','Emmanuel Saint-Fleur','Mirlande Francois','Reginald Michel','Sandra Alexis','Ludovic Georges','Fabienne Celestin','Daniel Augustin','Esther Belizaire','Mackenson Paul','Jocelyne Vincent','Ricardo Bien-Aime','Lunise Cadet','Stanley Pierre-Louis','Béatrice Laguerre'];
 S.members=N.map((n,i)=>{const [first,...l]=n.split(' ');return{id:'s'+i,first,last:l.join(' '),phone:'(555) 010-'+String(1000+i*37).slice(-4),hands:i===1?2:(i===3||i===4)?0.5:1,pw:i===4?3:i}});
 S.pay={};S.late={};S.fee=50;S.members.forEach((m,i)=>{for(let w=0;w<3;w++){if((i*7+w*5)%11!==0&&!(w===2&&i%3===0))S.pay[m.id+'_'+w]=(i%6===0&&w===1)?50:100}});if(S.pay['s2_0']){S.pay['s2_0']+=50;S.late['s2_0']=50}S.cleared=false;save()}
function clearAll(){if(!confirm('Remove everyone and all payments?'))return;S.members=[];S.pay={};S.late={};S.cleared=true;save();render()}
let tab='week',wk=0,sel={},impMsg='';
const $=s=>document.querySelector(s);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const money=n=>'$'+(+n||0).toLocaleString(undefined,{maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wdate=i=>{const d=new Date(S.start+'T12:00:00');d.setDate(d.getDate()+7*i);return d};
const fd=i=>wdate(i).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const amt=(m,w)=>+S.pay[m+'_'+w]||0;
const setAmt=(m,w,v)=>{v=parseFloat(v);if(v>0)S.pay[m+'_'+w]=v;else{delete S.pay[m+'_'+w];delete S.late[m+'_'+w]}save()};
const weekTotal=w=>S.members.reduce((t,m)=>t+amt(m.id,w),0);
const todayWeek=()=>{const d=Math.floor((Date.now()-wdate(0))/6048e5);return Math.min(Math.max(d,0),S.weeks-1)};
wk=todayWeek();
function tabs(){$('#tabs').innerHTML=[['week','This week'],['all','Whole timeframe'],['report','Weekly report'],['payout','Payout schedule'],['people','People & setup']].map(([k,l])=>`<button class="tab ${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}
function render(){tabs();({week:weekV,all:allV,report:repV,payout:payV,people:peopleV})[tab]()}
function weekV(){
 if(!S.members.length){$('#view').innerHTML='<div class="panel">Add your people first in <b>People & setup</b>.</div>';return}
 const paid=S.members.filter(m=>amt(m.id,wk)>0).length,un=S.members.length-paid;
 let h=`<div class="panel"><div class="row"><label>Week<select onchange="wk=+this.value;sel={};render()">${Array.from({length:S.weeks},(_,i)=>`<option value="${i}" ${i===wk?'selected':''}>Week ${i+1} - ${fd(i)}</option>`).join('')}</select></label>
 <button class="btn" onclick="wk=Math.max(0,wk-1);sel={};render()">Prev</button><button class="btn" onclick="wk=Math.min(S.weeks-1,wk+1);sel={};render()">Next</button></div>
 <div class="stats"><div class="stat"><b>${money(weekTotal(wk))}</b><span>Collected this week</span></div><div class="stat"><b>${paid} of ${S.members.length}</b><span>Paid</span></div><div class="stat r"><b>${un}</b><span>Still owe</span></div><div class="stat"><b>${money(pot())}</b><span>Expected</span></div><div class="stat late"><b>${money(S.members.reduce((t,m)=>t+(+S.late[m.id+'_'+wk]||0),0))}</b><span>Late fees this week</span></div><div class="stat r"><b style="font-size:19px">${esc(recv(wk))}</b><span>Receives this week</span></div></div></div>
 <div class="panel"><div class="scroll"><table><tr><th>Paid</th><th>Name</th><th>Amount</th><th>Remind</th></tr>`;
 S.members.forEach(m=>{const a=amt(m.id,wk);h+=`<tr><td class="${a?(S.late[m.id+'_'+wk]?'late':'paid'):(Date.now()>cutoff(wk)?'od':'unp')}"><input type="checkbox" aria-label="Paid ${esc(nm(m))}" ${a?'checked':''} onchange="tick('${m.id}',this.checked)"></td><td>${esc(nm(m))}<div class="mut" style="font-size:13px">${m.hands!=1?m.hands+' hand'+(m.hands==1?'':'s')+' - ':''}${esc(m.phone||'no phone')}</div>${S.late[m.id+'_'+wk]?'<div class="badge">Paid late +'+money(S.late[m.id+'_'+wk])+'</div>':''}${!a&&Date.now()>cutoff(wk)?'<div class="badge od">Late fee +'+money(S.fee)+' added - owes '+money(due(m)+S.fee)+'</div>':''}</td>
 <td><input type="number" min="0" step="any" value="${a||''}" placeholder="${due(m)+(!a&&Date.now()>cutoff(wk)?S.fee:0)}" aria-label="Amount ${esc(nm(m))}" onchange="setAmt('${m.id}',wk,this.value);render()"></td>
 <td>${a?'<span class="mut">-</span>':`<input type="checkbox" aria-label="Remind ${esc(nm(m))}" ${sel[m.id]!==false?'checked':''} onchange="sel['${m.id}']=this.checked;upd()">`}</td></tr>`});
 h+=`</table></div></div><div class="panel"><h2>Send reminder</h2><label>Message<textarea id="msg" rows="3" oninput="S.msg=this.value;save();upd()">${esc(S.msg)}</textarea></label><div class="mut" style="font-size:13px;margin:4px 0 10px">Use {name}, {week}, {date}. Opens your phone's messages; you press send.</div>
 <div class="row"><button class="btn red" onclick="selectUnpaid()">Select everyone who has not paid</button></div><div id="sms" style="margin-top:12px"></div></div>`;
 $('#view').innerHTML=h;upd()}
function tick(id,on){const k=id+'_'+wk;if(!on){setAmt(id,wk,0)}else{let a=due(S.members.find(m=>m.id===id));if(Date.now()>cutoff(wk)){a+=S.fee;S.late[k]=S.fee}else delete S.late[k];setAmt(id,wk,a)}save();render()}
function selectUnpaid(){sel={};S.members.forEach(m=>sel[m.id]=amt(m.id,wk)===0);render()}
function msgFor(m){return S.msg.replace(/{name}/g,m.first).replace(/{week}/g,wk+1).replace(/{date}/g,fd(wk))}
function upd(){const el=$('#sms');if(!el)return;
 const list=S.members.filter(m=>amt(m.id,wk)===0&&sel[m.id]!==false);
 const withP=list.filter(m=>m.phone);
 let h=`<b>${list.length}</b> selected`+(list.length-withP.length?` <span class="mut">(${list.length-withP.length} missing a phone number)</span>`:'');
 if(withP.length){const nums=withP.map(m=>m.phone.replace(/[^\d+]/g,'')).join(',');
  h+=`<div style="margin:8px 0"><a class="btn pri" style="display:inline-block;text-decoration:none" href="sms:${nums}?&body=${encodeURIComponent(S.msg.replace(/{name}/g,'').replace(/{week}/g,wk+1).replace(/{date}/g,fd(wk)))}">Text all selected in one message</a></div><div class="mut" style="font-size:13px">Tap Text or WhatsApp for each person. The button changes to Sent after you tap it.</div>`;
  h+=withP.map(m=>{const n=m.phone.replace(/[^\d+]/g,''),d=n.replace(/\D/g,''),wa=(n.startsWith('+')||d.length>10)?d:(S.cc||'1')+d.replace(/^0+/,''),b=encodeURIComponent(msgFor(m)),k=m.id+'_'+wk;return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)"><span style="min-width:150px">${esc(nm(m))}</span><a class="btn ${sent[k+'s']?'':'pri'}" style="text-decoration:none" href="sms:${n}?&body=${b}" onclick="sent['${k}s']=1;setTimeout(upd,300)">${sent[k+'s']?'Text sent':'Text'}</a><a class="btn ${sent[k+'w']?'':'pri'}" style="text-decoration:none" href="https://wa.me/${wa}?text=${b}" target="_blank" rel="noopener" onclick="sent['${k}w']=1;setTimeout(upd,300)">${sent[k+'w']?'WhatsApp sent':'WhatsApp'}</a></div>`}).join('')}
 el.innerHTML=h}
let gr={},gc={},sent={};
function selAll(on){S.members.forEach(m=>gr[m.id]=on);for(let w=0;w<S.weeks;w++)gc[w]=on;document.querySelectorAll('.gck').forEach(c=>c.checked=on)}
function clearSel(){let n=0;Object.keys(S.pay).forEach(k=>{const i=k.lastIndexOf('_'),id=k.slice(0,i),w=+k.slice(i+1);if(gr[id]||gc[w])n++});
 if(!n){alert('Nothing to clear. Tick a person, a week, or Select all first.');return}
 if(!confirm('Clear '+n+' payment amount'+(n===1?'':'s')+'? This cannot be undone.'))return;
 Object.keys(S.pay).forEach(k=>{const i=k.lastIndexOf('_'),id=k.slice(0,i),w=+k.slice(i+1);if(gr[id]||gc[w]){delete S.pay[k];delete S.late[k]}});gr={};gc={};save();allV()}
function allV(){
 if(!S.members.length){$('#view').innerHTML='<div class="panel">Add your people first in <b>People & setup</b>.</div>';return}
 const grand=Array.from({length:S.weeks},(_,w)=>weekTotal(w)).reduce((a,b)=>a+b,0);
 let h=`<div class="panel"><div class="stats"><div class="stat"><b>${money(grand)}</b><span>Collected so far</span></div><div class="stat"><b>${money(pot()*S.weeks)}</b><span>Expected in total</span></div></div>
 <div class="mut" style="font-size:14px">Type an amount in any box to record or fix a payment. Green means paid, orange means paid late (late fee added), red means overdue. To clear amounts, tick a person (row) or a week (column), or tick Select all, then press Clear selected amounts.</div><div class="row" style="margin-top:10px;align-items:center"><label style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" onchange="selAll(this.checked)"> Select all</label><button class="btn red" onclick="clearSel()">Clear selected amounts</button></div></div><div class="panel"><div class="scroll"><table class="grid"><tr><th>Name</th>`;
 for(let w=0;w<S.weeks;w++)h+=`<th><input type="checkbox" class="gck" aria-label="Select week ${w+1}" ${gc[w]?'checked':''} onchange="gc[${w}]=this.checked"><br>W${w+1}<div class="mut" style="font-weight:400;font-size:12px">${fd(w)}</div></th>`;
 h+='<th>Total</th></tr><tr><td>Receives</td>'+Array.from({length:S.weeks},(_,w)=>`<td style="font-size:12px;white-space:normal;color:var(--red)">${recv(w)==='Not set'?'':esc(recv(w))}</td>`).join('')+'<td></td></tr>';
 S.members.forEach(m=>{let t=0;h+=`<tr><td><label style="flex-direction:row;align-items:center;gap:6px;color:var(--ink)"><input type="checkbox" class="gck" aria-label="Select ${esc(nm(m))}" ${gr[m.id]?'checked':''} onchange="gr['${m.id}']=this.checked">${esc(nm(m))}</label></td>`;for(let w=0;w<S.weeks;w++){const a=amt(m.id,w);t+=a;h+=`<td class="${a?(S.late[m.id+'_'+w]?'late':'paid'):(Date.now()>cutoff(w)?'od':'')}"><input type="number" min="0" step="any" value="${a||''}" aria-label="${esc(nm(m))} week ${w+1}" onchange="setAmt('${m.id}',${w},this.value);allV()"></td>`}h+=`<td><b>${money(t)}</b></td></tr>`});
 h+='<tr><td><b>Week total</b></td>';for(let w=0;w<S.weeks;w++)h+=`<td><b>${money(weekTotal(w))}</b></td>`;
 h+=`<td><b>${money(grand)}</b></td></tr></table></div></div>`;$('#view').innerHTML=h}
function peopleV(){
 let h=`<div class="panel"><h2>Setup</h2><div class="row"><label>First payment date<input type="date" value="${S.start}" onchange="S.start=this.value;save()"></label>
 <label>Number of weeks<input type="number" min="1" max="104" value="${S.weeks}" onchange="S.weeks=Math.max(1,+this.value||1);wk=Math.min(wk,S.weeks-1);save()"></label>
 <label>Usual weekly amount (1 hand)<input type="number" min="0" step="any" value="${S.amount}" onchange="S.amount=+this.value||0;save()"></label><label>Late fee<input type="number" min="0" step="any" value="${S.fee}" onchange="S.fee=+this.value||0;save()"></label><label>Late fee added at (day after due)<input type="time" value="${S.lateAt}" onchange="S.lateAt=this.value||'00:00';save()"></label><label>Country code (WhatsApp)<input value="${S.cc}" style="width:80px" onchange="S.cc=this.value.replace(/\D/g,'')||'1';save()"></label></div>
 <div class="mut" style="font-size:13px;margin-top:8px">Hands set how much each person pays: 1 = the usual amount, 2 = double, 0.5 = half (two people can split one hand). Tick-as-paid fills in usual amount x hands, and you can still type any amount. A late fee is added automatically at the time below on the day after the due date. If you tick someone as paid after that, the fee is included and the box turns orange.</div><div style="margin-top:10px;padding:10px;border-left:5px solid #e08a00;background:var(--late);color:var(--latet);border-radius:6px">${exEx()}</div></div>
 <div class="panel"><h2>Upload from Excel</h2><label>Excel or CSV file<input type="file" accept=".xlsx,.xls,.csv" onchange="importFile(this)"></label>
 <div class="mut" style="font-size:13px;margin-top:8px">Columns in this order: First name, Last name, Telephone. A header row is fine. People already on the list are skipped.</div><div id="imp" style="margin-top:8px;font-weight:600">${esc(impMsg)}</div></div>
 <div class="panel"><h2>People (${S.members.length})</h2><div class="row"><label>First name<input id="nf"></label><label>Last name<input id="nl"></label><label>Telephone<input id="np" type="tel"></label><label>Hands<input id="nh" type="number" step="0.5" min="0.5" value="1" style="width:80px"></label><button class="btn pri" onclick="addM()">Add person</button><button class="btn" onclick="clearAll()">Clear everyone</button></div>
 <div class="scroll" style="margin-top:10px"><table><tr><th>First</th><th>Last</th><th>Telephone</th><th>Hands</th><th></th></tr>${S.members.map(m=>`<tr><td><input value="${esc(m.first)}" aria-label="First name" onchange="edit('${m.id}','first',this.value)"></td><td><input value="${esc(m.last)}" aria-label="Last name" onchange="edit('${m.id}','last',this.value)"></td><td><input type="tel" value="${esc(m.phone||'')}" aria-label="Telephone" onchange="edit('${m.id}','phone',this.value)"></td><td><input type="number" step="0.5" min="0.5" style="width:80px" value="${m.hands}" aria-label="Hands" onchange="editN('${m.id}','hands',this.value)"></td><td><button class="btn" onclick="delM('${m.id}')">Remove</button></td></tr>`).join('')}</table></div></div>
 <div class="panel" style="border-color:var(--red)"><h2>Start from scratch</h2><div class="mut" style="margin-bottom:10px">When this sousou is finished, this permanently deletes every person, payment, payout date and setting saved on this device. It cannot be undone.</div><div class="row"><button class="btn red" onclick="wipe()">Delete everything and start over</button></div></div>`;
 $('#view').innerHTML=h}
function wipe(){if(prompt('This permanently deletes all people, payments, payout dates and settings. Type DELETE to confirm.')!=='DELETE')return;
 S={start:new Date().toISOString().slice(0,10),weeks:25,amount:100,msg:'Hi {name}, friendly reminder: your sousou payment for week {week} ({date}) is due. Thank you!',fee:50,lateAt:'00:00',cc:'1',late:{},members:[],pay:{},cleared:true};sel={};impMsg='';wk=0;try{localStorage.removeItem(KEY)}catch(e){}save();tab='people';render()}
function editN(id,k,v){const m=S.members.find(x=>x.id===id);m[k]=k==='pw'?(v===''?null:+v):(parseFloat(v)>0?parseFloat(v):1);save();render()}
function autoPw(shuf){const l=S.members.slice();if(shuf)for(let i=l.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l[i],l[j]]=[l[j],l[i]]}S.members.forEach(m=>m.pw=null);l.forEach((m,i)=>{if(i<S.weeks)m.pw=i});save();render()}
let rf='all';
function repV(){
 if(!S.members.length){$('#view').innerHTML='<div class="panel">Add your people first in <b>People & setup</b>.</div>';return}
 const hs=[...new Set(S.members.map(m=>+m.hands||1))].sort((a,b)=>a-b);
 if(rf!=='all'&&!hs.includes(+rf))rf='all';
 const L=rf==='all'?S.members:S.members.filter(m=>(+m.hands||1)===+rf);
 const cur=Date.now()<wdate(0)?-1:Math.min(Math.floor((Date.now()-wdate(0))/6048e5),S.weeks-1);
 const exp=L.reduce((t,m)=>t+due(m),0),lf=L.reduce((t,m)=>{for(let w=0;w<S.weeks;w++)t+=(+S.late[m.id+'_'+w]||0);return t},0);
 let tc=0,te=0,to=0,rows='';
 for(let w=0;w<S.weeks;w++){const col=L.reduce((t,m)=>t+amt(m.id,w),0),np=L.filter(m=>amt(m.id,w)>0).length,owed=L.reduce((t,m)=>t+Math.max(0,due(m)-amt(m.id,w))+(amt(m.id,w)===0&&Date.now()>cutoff(w)?S.fee:0),0),past=w<=cur;
  tc+=col;if(past){te+=exp;to+=owed}
  rows+=`<tr><td>Week ${w+1}</td><td>${fd(w)}</td><td>${esc(recv(w)==='Not set'?'-':recv(w))}</td><td>${money(exp)}</td><td>${money(col)}</td><td>${np} of ${L.length}</td><td>${past?money(owed):'<span class="mut">upcoming</span>'}</td></tr>`}
 const prs=L.map(m=>{let paid=0,miss=0,fees=0,pend=0;for(let w=0;w<S.weeks;w++){const a=amt(m.id,w);paid+=a;fees+=(+S.late[m.id+'_'+w]||0);if(w<=cur&&a===0){miss++;if(Date.now()>cutoff(w))pend+=S.fee}}const dsf=due(m)*(cur+1),owes=Math.max(0,dsf-(paid-fees))+pend;return `<tr><td>${esc(nm(m))}</td><td>${m.hands}</td><td>${money(due(m))}</td><td>${money(paid)}</td><td>${money(dsf)}</td><td>${fees+pend?'<span class="badge">'+money(fees+pend)+'</span>':'-'}</td><td class="${owes>0?'od':'paid'}">${money(owes)}</td><td>${miss}</td></tr>`}).join('');
 $('#view').innerHTML=`<div class="panel"><div class="row"><label>Filter by hands<select onchange="rf=this.value;repV()"><option value="all">All hands</option>${hs.map(x=>`<option value="${x}" ${rf!=='all'&&+rf===x?'selected':''}>${x} ${x===1?'hand':'hands'}</option>`).join('')}</select></label></div>
 <div class="stats"><div class="stat"><b>${money(tc)}</b><span>Collected so far</span></div><div class="stat late"><b>${money(lf)}</b><span>Late fees collected</span></div><div class="stat"><b>${money(te)}</b><span>Due so far</span></div><div class="stat r"><b>${money(to)}</b><span>Still owed</span></div><div class="stat"><b>${L.length}</b><span>People shown</span></div><div class="stat"><b>${money(exp*S.weeks)}</b><span>Expected, full ${S.weeks} weeks</span></div></div></div>
 <div class="panel"><h2>Week by week</h2><div class="scroll"><table><tr><th>Week</th><th>Date</th><th>Receives</th><th>Expected</th><th>Collected</th><th>Paid</th><th>Still owed</th></tr>${rows}<tr><td><b>Total</b></td><td></td><td></td><td><b>${money(exp*S.weeks)}</b></td><td><b>${money(tc)}</b></td><td></td><td><b>${money(to)}</b></td></tr></table></div></div>
 <div class="panel"><h2>By person</h2><div class="scroll"><table><tr><th>Name</th><th>Hands</th><th>Weekly</th><th>Paid so far</th><th>Due so far</th><th>Late fees</th><th>Owes</th><th>Weeks missed</th></tr>${prs}</table></div></div>`}
function payV(){
 const un=S.members.filter(m=>m.pw===null||m.pw>=S.weeks).length;
 let h=`<div class="panel"><h2>Who receives the money, and when</h2><div class="mut" style="margin-bottom:10px">Pick a week for each person. Two people can share a week (for example, two half hands). You can change any date at any time.</div><div class="row"><button class="btn pri" onclick="autoPw(false)">Fill in list order</button><button class="btn" onclick="autoPw(true)">Shuffle randomly</button><button class="btn" onclick="S.members.forEach(m=>m.pw=null);save();render()">Clear all dates</button></div>${un?`<div style="margin-top:10px;color:var(--red);font-weight:600">${un} ${un===1?'person has':'people have'} no payout week yet.</div>`:''}</div>
 <div class="panel"><div class="scroll"><table><tr><th>Name</th><th>Hands</th><th>Receives on</th><th>Paid out</th></tr>`+
 S.members.map(m=>`<tr><td>${esc(nm(m))}</td><td>${m.hands}</td><td><select aria-label="Payout week ${esc(nm(m))}" onchange="editN('${m.id}','pw',this.value)"><option value="">Not set</option>${Array.from({length:S.weeks},(_,w)=>`<option value="${w}" ${m.pw===w?'selected':''}>Week ${w+1} - ${fd(w)}</option>`).join('')}</select></td><td><input type="checkbox" aria-label="Paid out ${esc(nm(m))}" ${m.out?'checked':''} onchange="S.members.find(x=>x.id==='${m.id}').out=this.checked;save();render()"></td></tr>`).join('')+
 `</table></div></div><div class="panel"><h2>Week by week</h2><div class="scroll"><table><tr><th>Week</th><th>Date</th><th>Receives</th><th>Full pot</th><th>Collected</th></tr>`+
 Array.from({length:S.weeks},(_,w)=>{const r=S.members.filter(m=>m.pw===w);return `<tr><td>Week ${w+1}</td><td>${fd(w)}</td><td>${r.map(m=>esc(nm(m))+(m.out?' (paid out)':'')).join(', ')||'<span class="mut">Nobody yet</span>'}</td><td>${money(pot())}</td><td>${money(weekTotal(w))}</td></tr>`}).join('')+`</table></div></div>`;
 $('#view').innerHTML=h}
function importFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{
 const wb=XLSX.read(e.target.result,{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
 let c={f:0,l:1,p:2},st=0;const h=(rows[0]||[]).map(x=>String(x).toLowerCase());
 if(h.some(x=>/first|last|phone|tel|mobile|cell|name/.test(x))){st=1;h.forEach((x,i)=>{if(/first/.test(x))c.f=i;else if(/last|sur/.test(x))c.l=i;else if(/phone|tel|mobile|cell/.test(x))c.p=i})}
 let n=0,k=0;rows.slice(st).forEach(r=>{const first=String(r[c.f]||'').trim(),last=String(r[c.l]||'').trim(),phone=String(r[c.p]||'').trim();
  if(!first&&!last)return;if(S.members.some(m=>m.first===first&&m.last===last)){k++;return}
  S.members.push({id:'m'+Date.now()+Math.floor(Math.random()*99999)+n,first,last,phone,hands:1,pw:null});n++});
 save();impMsg='Added '+n+' people'+(k?' ('+k+' already on the list)':'')+'.';render()}catch(err){impMsg='Could not read that file. Try saving it as .xlsx or .csv.';render()}};
 r.readAsArrayBuffer(f)}
function addM(){const f=$('#nf').value.trim(),l=$('#nl').value.trim();if(!f&&!l)return;S.members.push({id:'m'+Date.now()+Math.floor(Math.random()*999),first:f,last:l,phone:$('#np').value.trim(),hands:parseFloat($('#nh').value)>0?parseFloat($('#nh').value):1,pw:null});save();render()}
function edit(id,k,v){S.members.find(m=>m.id===id)[k]=v.trim();save()}
function delM(id){const m=S.members.find(x=>x.id===id);if(!confirm('Remove '+nm(m)+' and all their payments?'))return;S.members=S.members.filter(x=>x.id!==id);Object.keys(S.pay).forEach(k=>{if(k.startsWith(id+'_'))delete S.pay[k]});Object.keys(S.late).forEach(k=>{if(k.startsWith(id+'_'))delete S.late[k]});save();render()}
if(!S.members.length)tab='people';
render();
</script></body></html>
